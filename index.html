{t:"الهوية البصرية (Branding)",def:"الهوية البصرية هي مجموعة العناصر اللي بتخلي البراند يتعرف عليه من بعيد: لوجو وألوان وخطوط وأسلوب صور.",why:"لأن الناس بتفتكر البراند المتناسق، وبتثق فيه أكتر.",parts:[{"h": "عناصر الهوية", "p": ["اللوجو، لوحة ألوان من 2 لـ 4 ألوان، خطان بالكتير، وأسلوب ثابت للصور والأيقونات."]}, {"h": "الدليل (Brand Guide)", "p": ["ملف بيشرح للفريق إزاي يستخدموا العناصر دي صح، علشان أي تصميم جديد يطلع بنفس الروح."]},{h:"عناصر الهوية البصرية",p:["الهوية البصرية هي شكل البراند كله: اللوجو، الألوان، الخطوط، وأسلوب الصور. لما تشوفها مع بعض تحس إنهم حاجة واحدة.","أي براند ناجح عنده دليل هوية (Brand Guidelines) بيحدد الألوان بالأكواد، والخطوط المسموحة، وأحجام اللوجو واستخداماته."]},{h:"إزاي تبني هوية لعميل",p:["ابدأ بفهم البراند: بيقدم إيه؟ وجمهوره مين؟ وإحساسه إيه، فخم ولا بسيط ولا مرح؟","بعدها اختار لونين أو تلاتة أساسيين وخط أو خطين، والزمهم في كل التصميمات. الثبات هو اللي بيخلي الناس تفتكر البراند."]}],q:[["إيه عناصر الهوية البصرية؟", ["لوجو وألوان وخطوط", "صور بس", "اسم الشركة بس"], 0], ["عدد الخطوط المناسب غالبًا؟", ["خطان", "10 خطوط", "مفيش"], 0], ["الـ Brand Guide بيفيد في؟", ["توحيد التصاميم", "تسريع النت", "طباعة الورق"], 0], ["ليه الاتساق مهم؟", ["بيبني ثقة وتعرّف", "بيزود الحجم", "مفيش سبب"], 0],["دليل الهوية (Brand Guidelines) بيحدد إيه؟",["الألوان والخطوط واستخدامات اللوجو","أسعار المنتجات","عناوين الفروع"],0],["أهم حاجة تخلي الناس تفتكر البراند؟",["الثبات في الألوان والأسلوب","تغيير اللوجو كل شهر","استخدام خطوط كتير"],0],["أول خطوة في بناء هوية لعميل؟",["فهم البراند وجمهوره","اختيار ألوان عشوائية","نسخ هوية منافس"],0]]},
{t:"الصور وأنواع الملفات",def:"نوع الملف بيحدد جودة الصورة وحجمها واستخدامها: PNG وJPG وSVG وPDF.",why:"علشان تسلّم الملف الصح ومايطلعش مشوش أو تقيل.",parts:[{"h": "الفرق بين الأنواع", "p": ["JPG للصور وحجمه صغير. PNG بيدعم الخلفية الشفافة. SVG فيكتور بيتكبر من غير ما يبوظ، مناسب للوجو. PDF للطباعة والمستندات."]}, {"h": "الدقة", "p": ["للشاشة 72 DPI كفاية، وللطباعة محتاج 300 DPI."]},{h:"امتدادات الصور المشهورة",p:["JPG: الأنسب للصور الفوتوغرافية، حجمه صغير بس مبيدعمش الشفافية.","PNG: بيدعم الخلفية الشفافة، مناسب للوجوهات والأيقونات، بس حجمه أكبر.","SVG: صيغة فيكتور بتكبر لأي حجم من غير ما تبوظ، مثالية للوجوهات على المواقع."]},{h:"جودة الصور ودقتها",p:["الدقة (Resolution) بتتقاس بالبيكسل. صورة للسوشيال ميديا غير صورة للطباعة: الطباعة محتاجة 300 DPI على الأقل.","متكبرش صورة صغيرة لحجم أكبر، هتبقى مكسلة. اشتغل دايما من نسخة كبيرة وصغّر منها."]}],q:[["الملف اللي بيدعم الشفافية؟", ["PNG", "JPG", "كلهم مفيش"], 0], ["الأنسب للوجو يتكبر من غير فقد جودة؟", ["SVG", "JPG", "GIF"], 0], ["دقة الطباعة؟", ["300 DPI", "72 DPI", "10 DPI"], 0], ["JPG مناسب لـ؟", ["الصور الفوتوغرافية", "الشفافية", "الرسم الفيكتور"], 0],["أنسب صيغة للوجو على موقع؟",["SVG","JPG","GIF"],0],["PNG بيتميز عن JPG بإيه؟",["دعم الخلفية الشفافة","حجم أصغر دايما","ألوان أكتر"],0],["دقة الطباعة المناسبة؟",["300 DPI","72 DPI","10 DPI"],0]]},

function badge(){const r=rank();return `<div class=lvl><span class=chip>🏅 المستوى ${r.l} · ${r.n}</span><small>${r.nx?`فاضل ${r.nx} درس للمستوى الجاي`:'وصلت لأعلى مستوى!'}</small></div>`}
function head(){return badge()+`<div class=top><a class=brand href=# onclick="go('home');return false"><span class=lg>🎓</span><span><b>اتعلّم مهارة</b><small>برمجة ومونتاج بالعربي ببلاش</small></span></a>${user?`<button onclick="logout()">خروج</button>`:(guest?`<button class=p onclick="go('login')">تسجيل الدخول</button>`:'')}</div>`}
function go(n,a={}){view=Object.assign({n},a);ans={};checked=false;render();window.scrollTo(0,0)}
function render(){
 if(view.n==='login'||(!user&&!guest)){return login()}
 app.innerHTML=head()+({home,track,lesson}[view.n]||home)();
}
function login(){
 app.innerHTML=`<div class=hero><span class=big>🎓</span><h1><span class=grad>اتعلّم مهارة</span></h1><p class=sub>برمجة ومونتاج وتصميم بالعربي ببلاش</p></div><div class=card><h2 style=margin-top:0>سجّل دخولك بحساب جوجل</h2><p class=sub>تقدمك بيتحفظ على الجهاز ده (الحفظ على حسابك لسه تجريبي).</p><button class="p wide" onclick="google()">🔐 الدخول بحساب Gmail</button><p class=err id=err>${msg}</p><button class=wide onclick="localStorage.setItem('guest','1');guest=true;go('home')">تصفح بدون حساب</button><p class=sub style="font-size:13px">بالدخول انت موافق على <a href=privacy.html style=color:#22d3ee>سياسة الخصوصية</a></p></div>`}
async function google(){if(!sb){msg='مشكلة في تحميل خدمة الدخول، جرب تاني';return login()}
 const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error){msg='تعذر الدخول: '+error.message;login()}}
async function logout(){if(sb)await sb.auth.signOut();user=null;guest=false;localStorage.removeItem('guest');go('home')}
function home(){const d=totalDone(),t=total();
 return `<div class=hero><span class=big>🚀</span><h1>يلا نتعلم <span class=grad>مهارة جديدة</span></h1><p class=sub>أهلاً بيك! هنا هتتعلم برمجة وتصميم ومونتاج من الصفر، بالمصري وببلاش. اختار كورس، اقرا الدرس، وامتحن نفسك، وكل ما تنجح هتطلع مستوى جديد.</p><div class=bar><i style="width:${Math.round(d/t*100)}%"></i></div><span class=t>${d} من ${t} درس خلصت</span>${user?`<p class=sub>أهلاً ${e(user.user_metadata&&user.user_metadata.name||user.email)}</p>`:''}</div><div class=grid>`+TRACKS.map((x,n)=>{const c=trackDone(x),tt=trackLessons(x).length;return `<div class=card style="animation-delay:${n*.1}s"><div class=ic style="background:${x.col}33">${x.ic}</div><b style="font-size:18px">${x.name}</b><p class=sub>${x.blurb}</p><div class=bar><i style="width:${c/tt*100}%;background:${x.col}"></i></div><span class=sub>${c}/${tt} دروس</span><br><button class=p onclick="go('track',{t:'${x.id}'})">افتح الكورس ←</button></div>`}).join('')+`</div>`}
const T=()=>TRACKS.find(x=>x.id===view.t);
function track(){const x=T();
 return `<button class=back onclick="go('home')">→ الرئيسية</button><div class=hero2><span class=big2>${x.ic}</span><h1>${x.name}</h1></div><div class=card><h2 style=margin-top:0>إيه هو ${x.name.replace('البرمجة بلغة ','')}؟</h2><p>${e(x.intro.def)}</p><h2>ليه تتعلمه؟</h2><p>${e(x.intro.why)}</p></div>`+x.levels.map((lv,i)=>`<h2>${lv.name}</h2>`+lv.lessons.map((ls,j)=>{const b=best(x.id,i+'-'+j);return `<div class="row" onclick="go('lesson',{t:'${x.id}',i:${i},j:${j}})"><span class=num style="background:${x.col}">${j+1}</span><span class=rt><b>${ls.t}</b><small>${ls.q.length} سؤال في الامتحان</small></span><span class="${b>=60?'t':'sub'}">${b>=60?'✓ '+b+'%':(b?b+'%':'')}</span></div>`}).join('')).join('')}
function lesson(){const x=T(),ls=x.levels[view.i].lessons[view.j],k=view.i+'-'+view.j;
 const nxt=(()=>{const L=x.levels[view.i].lessons;if(view.j<L.length-1)return {i:view.i,j:view.j+1};if(view.i<x.levels.length-1)return {i:view.i+1,j:0};return null})();
 let h=`<button class=back onclick="go('track',{t:'${x.id}'})">→ ${x.name}</button><p class=sub>الدرس ${view.j+1}</p><h1>${ls.t}</h1>`;
 h+=`<div class=card def><b class=t>التعريف</b><p>${e(ls.def)}</p><b class=t>ليه مهم؟</b><p>${e(ls.why)}</p></div>`;
 ls.parts.forEach(p=>{h+=`<h2>${e(p.h)}</h2>`+p.p.map(s=>`<p>${e(s)}</p>`).join('')+(p.code?`<pre dir=ltr>${e(p.code)}</pre>`:'')});
 h+=`<h2 style="margin-top:36px">امتحان الدرس (${ls.q.length} سؤال)</h2>`;
 ls.q.forEach((q,n)=>{h+=`<div class=card><p><b>${n+1}. ${e(q[0])}</b></p>`+q[1].map((o,m)=>{let c='';if(checked){if(m===q[2])c='ok';else if(ans[n]===m)c='bad'}else if(ans[n]===m)c='sel';return `<button class="opt ${c}" onclick="pick(${n},${m})">${e(o)}</button>`}).join('')+`</div>`});
 if(!checked)h+=`<button class="p wide" onclick="finish()">تسليم الامتحان</button>`;
 else{const s=score(ls);h+=`<div class=card><h2 style=margin-top:0 class="${s>=60?'t':'err'}">${s>=60?'🎉 نجحت':'جرّب تاني'}: ${s}%</h2><p class=sub>${s>=60?'الدرس اتحسب خلصان.':'محتاج 60% علشان الدرس يتحسب. راجع الشرح وحاول تاني.'}</p><button onclick="go('lesson',{t:'${x.id}',i:${view.i},j:${view.j}})">أعد الامتحان</button> ${nxt&&s>=60?`<button class=p onclick="go('lesson',{t:'${x.id}',i:${nxt.i},j:${nxt.j}})">الدرس التالي ←</button>`:''}</div>`}
 return h}
function score(ls){let c=0;ls.q.forEach((q,n)=>{if(ans[n]===q[2])c++});return Math.round(c/ls.q.length*100)}
function pick(n,m){if(checked)return;ans[n]=m;const y=window.scrollY;render();window.scrollTo(0,y)}
function finish(){const x=T(),ls=x.levels[view.i].lessons[view.j];if(Object.keys(ans).length<ls.q.length){alert('جاوب على كل الأسئلة الأول');return}
 checked=true;const s=score(ls),k=key(x.id,view.i+'-'+view.j);if(s>(prog[k]||0)){prog[k]=s;saveProg()}render();document.querySelector('h2.t,h2.err')?.scrollIntoView({behavior:'smooth'})}
async function init(){
 if(sb){try{const {data}=await sb.auth.getSession();if(data&&data.session){user=data.session.user;const p=user.user_metadata&&user.user_metadata.progress;if(p)prog=Object.assign({},prog,p);localStorage.setItem('prog',JSON.stringify(prog))}
 sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_IN'&&s&&!user){user=s.user;render()}})}catch(x){}}
 render()}
init();

</script></body></html>
