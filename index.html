<style>:root{--bg:#0f1226;--card:#1a1e3d;--ink:#f4f5ff;--mut:#a9aed6;--a:#7c5cff;--b:#22d3ee;--ok:#34d399;--bad:#fb7185}

h1{font-size:28px;font-weight:800;margin:6px 0 8px;line-height:1.4}h2{font-size:20px;margin:26px 0 8px}p{line-height:1.9;margin:8px 0}
.sub{color:var(--mut)}small{display:block;color:var(--mut);font-weight:400;font-size:12px}

.hero2{display:flex;align-items:center;gap:12px;margin:8px 0 12px}.big2{font-size:44px}

.card{background:var(--card);border:1px solid #ffffff14;border-radius:20px;padding:18px;margin:14px 0;animation:fade .5s ease both}
.grid .card{transition:transform .2s,box-shadow .2s}.grid .card:hover{transform:translateY(-4px);box-shadow:0 12px 30px #0006}
.ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:30px;margin-bottom:10px}
button{font:inherit;font-weight:600;padding:12px 20px;border:1px solid #ffffff2a;background:#ffffff10;color:var(--ink);border-radius:14px;cursor:pointer;margin:4px 0;min-height:48px;transition:transform .15s,background .2s}
button:hover{transform:scale(1.03);background:#ffffff1c}
button.p{background:linear-gradient(90deg,var(--a),var(--b));border:0;color:#fff;box-shadow:0 6px 20px #7c5cff55}

pre{direction:ltr;text-align:left;background:#0b0d1d;border:1px solid #ffffff14;padding:16px;border-radius:14px;overflow-x:auto;color:#9ef0d0;font-size:14px;line-height:1.7}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}.brand b{font-size:20px;display:block}.lg{font-size:30px}

.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}.rt{flex:1}.rt b{display:block}
@media(min-width:640px){.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.grid .card{margin:0}}
</style></head><body><main id="app"></main><script>const PY={id:'py',ic:'🐍',col:'#22c55e',name:'البرمجة بلغة Python',blurb:'من الصفر: تفهم يعني إيه برمجة وتكتب برامجك الأولى.',
intro:{def:'البرمجة هي إنك تكتب تعليمات بلغة الكمبيوتر يفهمها، علشان ينفذ لك مهمة معينة. و Python لغة برمجة سهلة القراءة، قريبة من الإنجليزي، ومستخدمة في المواقع والذكاء الاصطناعي وتحليل البيانات والأتمتة.',why:'لو اتعلمت البرمجة تقدر تبني مواقع وتطبيقات وبوتات، وتشتغل أونلاين، وتحل مشاكل بسرعة. وPython أنسب لغة للبداية.'},
levels:[{name:'المستوى الأول: الأساسيات',lessons:[
{t:'يعني إيه برمجة؟',def:'البرنامج هو مجموعة أوامر مكتوبة بترتيب، الكمبيوتر بينفذها واحد ورا التاني.',why:'لازم تفهم الفكرة دي الأول قبل أي كود، لأن كل لغة برمجة بتبني عليها.',parts:[
{h:'الكمبيوتر بينفذ بالحرف',p:['الكمبيوتر مبيفهمش لوحده. هو بينفذ بالظبط اللي بتكتبه، بالترتيب، من فوق لتحت.','لو كتبت خطأ، هيطلعلك رسالة خطأ (Error) بتقولك فين المشكلة.']},
{h:'الخوارزمية',p:['الخوارزمية هي خطوات حل مشكلة. مثال: عمل كوباية شاي: 1) سخّن المية 2) حط الشاي 3) صب المية 4) زوّد سكر. البرمجة إنك تكتب الخطوات دي بلغة الكمبيوتر.']},
{h:'أول برنامج',p:['في Python بنطبع كلام على الشاشة بالأمر print.'],code:'print("اهلا يا عالم")'}],
q:[['البرنامج هو؟',['مجموعة أوامر مرتبة ينفذها الكمبيوتر','لعبة جاهزة','نوع من الأجهزة'],0],['الكمبيوتر بينفذ الأوامر بأي ترتيب؟',['اه عشوائي','لا بالترتيب من فوق لتحت','حسب مزاجه'],1],['الخوارزمية هي؟',['برنامج جاهز','خطوات حل مشكلة','لغة برمجة'],1],['الأمر اللي بيطبع كلام على الشاشة في Python؟',['show','print','write'],1],['لو في خطأ في الكود، الكمبيوتر هيعمل إيه؟',['هيصلحه لوحده','هيظهر رسالة Error','هيقفل الجهاز'],1],['Python لغة؟',['برمجة','تصميم','مونتاج'],0]]},
{t:'المتغيرات وأنواع البيانات',def:'المتغير هو اسم بنخزن تحته قيمة في ذاكرة الكمبيوتر، زي علبة عليها اسم وجواها حاجة.',why:'من غير متغيرات مش هتقدر تخزن اسم المستخدم ولا نتيجة عملية حسابية ولا أي معلومة في برنامجك.',parts:[
{h:'إنشاء متغير',p:['بنكتب اسم المتغير وعلامة = وبعدها القيمة. علامة = هنا معناها "خزّن"، مش "يساوي" زي الرياضة.'],code:'name = "ahmed"\nage = 15\nprint(name)\nprint(age)'},
{h:'أنواع البيانات الأساسية',p:['int: رقم صحيح زي 5 و-3.','float: رقم عشري زي 3.14.','str: نص بين علامتين تنصيص زي "hello".','bool: صح أو غلط، بنكتبهم True و False.'],code:'x = 5          # int\ny = 2.5        # float\nz = "hi"       # str\nok = True      # bool\nprint(type(x))'},
{h:'قواعد تسمية المتغير',p:['الاسم يبدأ بحرف أو _ ومينفعش يبدأ برقم، ومينفعش فيه مسافات. و Python حساسة لحالة الحروف: age غير Age.']}],
q:[['المتغير هو؟',['اسم بنخزن تحته قيمة','نوع من الأخطاء','أمر للطباعة'],0],['النوع اللي بيمثل رقم عشري زي 3.14؟',['int','float','str'],1],['"hello" نوعه؟',['int','bool','str'],2],['أنهي اسم متغير صح؟',['1name','my name','my_name'],2],['علامة = في Python معناها؟',['خزّن القيمة في المتغير','يساوي رياضياً','اطبع'],0],['True نوعه؟',['bool','str','float'],0],['age و Age؟',['نفس المتغير','متغيرين مختلفين','خطأ'],1],['الأمر اللي بيعرفك نوع المتغير؟',['type','kind','print'],0]]},
{t:'الإدخال والإخراج',def:'الإخراج (print) بيعرض معلومة للمستخدم. والإدخال (input) بيخلي المستخدم يكتب معلومة للبرنامج.',why:'أي برنامج مفيد بيتفاعل مع المستخدم: بيسأله ويرد عليه.',parts:[
{h:'الأمر input',p:['الأمر input بيوقف البرنامج لحد ما المستخدم يكتب ويدوس Enter، وبيرجّع الكلام كنص (str) دايماً حتى لو كتب رقم.'],code:'name = input("اسمك ايه؟ ")\nprint("اهلا", name)'},
{h:'تحويل النوع',p:['علشان تعمل عملية حسابية على رقم جاي من input لازم تحوله: int() لرقم صحيح و float() لرقم عشري.'],code:'age = int(input("سنك كام؟ "))\nprint("السنة الجاية هيبقى سنك", age + 1)'},
{h:'f-string',p:['طريقة سهلة تدمج بيها متغيرات جوه نص: بنحط حرف f قبل التنصيص ونكتب المتغير بين { }.'],code:'name = "sara"\nprint(f"اهلا يا {name}")'}],
q:[['input بيرجّع القيمة كـ؟',['رقم','نص str','bool'],1],['علشان تحول نص لرقم صحيح؟',['int()','str()','print()'],0],['لو المستخدم كتب 5 في input، النوع؟',['int','str','float'],1],['print الغرض منه؟',['استقبال معلومة','عرض معلومة','تحويل نوع'],1],['f-string بتبدأ بحرف؟',['s','f','p'],1],['المتغير بيتحط بين؟',['( )','[ ]','{ }'],2]]},
{t:'العمليات الحسابية والمنطقية',def:'العمليات هي رموز بتعمل حساب أو مقارنة على القيم، زي + و - و > و ==.',why:'كل حساب أو قرار في البرنامج بيعتمد على عمليات.',parts:[
{h:'العمليات الحسابية',p:['+ جمع، - طرح، * ضرب، / قسمة (الناتج عشري)، // قسمة صحيحة، % باقي القسمة، ** أُس.'],code:'print(7 + 2)   # 9\nprint(7 / 2)   # 3.5\nprint(7 // 2)  # 3\nprint(7 % 2)   # 1\nprint(2 ** 3)  # 8'},
{h:'عمليات المقارنة',p:['== يساوي، != لا يساوي، > اكبر، < اصغر، >= اكبر او يساوي، <= اصغر او يساوي. الناتج دايماً True أو False.'],code:'print(5 > 3)    # True\nprint(5 == 6)   # False'},
{h:'العمليات المنطقية',p:['and: الاتنين لازم يكونوا صح. or: واحد على الاقل صح. not: بيعكس القيمة.'],code:'print(5 > 3 and 2 > 1)   # True\nprint(5 > 3 and 2 > 4)   # False\nprint(not True)          # False'}],
q:[['7 // 2 = ؟',['3','3.5','4'],0],['7 % 2 = ؟',['1','3','0'],0],['2 ** 3 = ؟',['6','8','5'],1],['5 == 5 ناتجها؟',['True','False','خطأ'],0],['5 != 5 ناتجها؟',['True','False','5'],1],['True and False ناتجها؟',['True','False','خطأ'],1],['True or False ناتجها؟',['True','False','خطأ'],0],['not True ناتجها؟',['True','False','1'],1],['10 / 4 = ؟',['2','2.5','2.0'],1]]},
{t:'الشروط if',def:'الشرط هو طريقة تخلي البرنامج ياخد قرار: ينفذ كود معين لو حاجة صح، وكود تاني لو غلط.',why:'من غير شروط البرنامج هيعمل نفس الحاجة دايماً. بالشروط بيبقى ذكي ويتصرف حسب الموقف.',parts:[
{h:'الشكل الأساسي',p:['بعد if بنكتب الشرط وبعده علامة :. والكود اللي هينفذ لازم يكون مزاح (Indentation) أربع مسافات.'],code:'age = 16\nif age >= 18:\n    print("كبير")\nelse:\n    print("صغير")'},
{h:'elif',p:['لو عندك أكتر من احتمال استخدم elif (اختصار else if). Python بتجرب الشروط بالترتيب وتنفذ أول واحد صح بس.'],code:'score = 85\nif score >= 90:\n    print("ممتاز")\nelif score >= 75:\n    print("جيد جدا")\nelif score >= 50:\n    print("ناجح")\nelse:\n    print("راسب")'},
{h:'خطأ شائع',p:['نسيان علامة : أو الإزاحة هيطلع IndentationError أو SyntaxError. واستخدام = بدل == في الشرط خطأ.']}],
q:[['الكود جوه if لازم يكون؟',['مزاح (Indentation)','في سطر لوحده بس','بين أقواس'],0],['بعد الشرط بنكتب؟',[';',':','.'],1],['لو score = 80 والكود فوق، الناتج؟',['ممتاز','جيد جدا','ناجح'],1],['elif معناها؟',['else if','end if','error if'],0],['else بتتنفذ لما؟',['الشرط صح','الشروط كلها غلط','دايماً'],1],['المقارنة الصح في الشرط؟',['if x = 5','if x == 5','if x equals 5'],1],['لو أكتر من elif صح، Python بتنفذ؟',['كلهم','أول واحد صح بس','آخر واحد'],1]]},
{t:'التكرار: for و while',def:'الحلقة (Loop) بتكرر كود عدد مرات من غير ما تكتبه كل مرة.',why:'بدل ما تكتب print 100 مرة، بتكتبها مرة واحدة جوه حلقة.',parts:[
{h:'حلقة for',p:['بتستخدمها لما تعرف عدد التكرار. range(5) بتدي الأرقام من 0 لـ 4 (آخر رقم مش بيدخل).'],code:'for i in range(5):\n    print(i)   # 0 1 2 3 4'},
{h:'حلقة while',p:['بتكرر طول ما الشرط صح. انتبه: لو الشرط فضل صح للأبد، البرنامج هيدخل في حلقة لا نهائية.'],code:'n = 3\nwhile n > 0:\n    print(n)\n    n = n - 1\nprint("خلص")'},
{h:'break و continue',p:['break بتخرج من الحلقة فوراً. continue بتتخطى باقي اللفة الحالية وتروح للي بعدها.'],code:'for i in range(10):\n    if i == 3:\n        break\n    print(i)   # 0 1 2'}],
q:[['range(5) بتدي الأرقام؟',['1 لـ 5','0 لـ 4','0 لـ 5'],1],['حلقة for بنستخدمها لما؟',['نعرف عدد التكرار','الشرط مجهول فقط','مفيش فرق'],0],['while بتكرر طول ما؟',['الشرط صح','الشرط غلط','للأبد دايماً'],0],['break وظيفتها؟',['تخرج من الحلقة','تكمل اللفة','تطبع'],0],['الحلقة اللا نهائية بتحصل لما؟',['الشرط مبيبقاش غلط ابداً','نستخدم for','نكتب print'],0],['كود: for i in range(3): print(i) بيطبع؟',['1 2 3','0 1 2','0 1 2 3'],1],['continue بتعمل؟',['بتتخطى اللفة الحالية','بتوقف البرنامج','بتعيد من الأول'],0]]},
{t:'القوائم Lists',def:'القائمة هي متغير واحد بيخزن مجموعة قيم مرتبة، بين [ ] ومفصولة بفاصلة.',why:'بدل ما تعمل 100 متغير، بتحط كل البيانات في قائمة واحدة وتتعامل معاها بسهولة.',parts:[
{h:'إنشاء والوصول',p:['الترقيم (index) بيبدأ من 0. العنصر الأخير ممكن توصله بـ -1.'],code:'fruits = ["apple", "banana", "mango"]\nprint(fruits[0])    # apple\nprint(fruits[-1])   # mango\nprint(len(fruits))  # 3'},
{h:'التعديل',p:['append بتضيف في الآخر. remove بتشيل قيمة. تقدر تغير عنصر بالـ index.'],code:'fruits.append("orange")\nfruits.remove("banana")\nfruits[0] = "grape"\nprint(fruits)'},
{h:'المرور على القائمة',p:['بنستخدم for علشان نعدي على كل عنصر.'],code:'for f in fruits:\n    print(f)'}],
q:[['index أول عنصر؟',['0','1','-1'],0],['fruits[-1] بيجيب؟',['أول عنصر','آخر عنصر','خطأ'],1],['الدالة اللي بتدي عدد العناصر؟',['len','count','size'],0],['اضافة عنصر في الآخر؟',['add','append','insert فقط'],1],['القائمة بتتكتب بين؟',['[ ]','( )','{ }'],0],['لو القائمة فيها 3 عناصر، آخر index؟',['3','2','1'],1],['لمسح قيمة معينة؟',['remove','delete فقط','erase'],0]]},
{t:'الدوال Functions',def:'الدالة هي كود له اسم، بتكتبه مرة وتستدعيه كل ما تحتاجه.',why:'الدوال بتخلي الكود منظم وبتمنع التكرار، وبتسهل إصلاح الأخطاء.',parts:[
{h:'تعريف دالة',p:['بنستخدم def ثم الاسم ثم أقواس وعلامة :. المدخلات اسمها parameters.'],code:'def greet(name):\n    print("اهلا", name)\n\ngreet("ali")\ngreet("mona")'},
{h:'return',p:['return بترجّع قيمة من الدالة علشان تستخدمها بعدين. بعد return الدالة بتنتهي.'],code:'def add(a, b):\n    return a + b\n\nresult = add(2, 3)\nprint(result)   # 5'},
{h:'متى استخدم دالة؟',p:['لو لقيت نفسك بتكرر نفس الكود أكتر من مرة، حطه في دالة.']}],
q:[['الكلمة اللي بتعرف دالة؟',['def','function','fun'],0],['return وظيفتها؟',['ترجّع قيمة','تطبع','تكرر'],0],['add(2, 3) في المثال بترجع؟',['23','5','خطأ'],1],['المدخلات في الدالة اسمها؟',['parameters','returns','loops'],0],['ليه بنستخدم الدوال؟',['علشان نمنع تكرار الكود','علشان نبطء البرنامج','مفيش سبب'],0],['بعد return الدالة؟',['بتكمل','بتنتهي','بتتكرر'],1]]},
{t:'مشروع صغير: حاسبة وتخمين رقم',def:'المشروع هو تطبيق عملي بيجمع كل اللي اتعلمته: متغيرات وشروط وحلقات ودوال.',why:'التطبيق العملي هو اللي بيثبت المعلومة، وبتطلع بشغل تقدر تعرضه.',parts:[

const T=()=>TRACKS.find(x=>x.id===view.t);
function track(){const x=T();
 return `<button class=back onclick="go('home')">→ الرئيسية</button><div class=hero2><span class=big2>${x.ic}</span><h1>${x.name}</h1></div><div class=card><h2 style=margin-top:0>إيه هو ${x.name.replace('البرمجة بلغة ','')}؟</h2><p>${e(x.intro.def)}</p><h2>ليه تتعلمه؟</h2><p>${e(x.intro.why)}</p></div>`+x.levels.map((lv,i)=>`<h2>${lv.name}</h2>`+lv.lessons.map((ls,j)=>{const b=best(x.id,i+'-'+j);return `<div class="row" onclick="go('lesson',{t:'${x.id}',i:${i},j:${j}})"><span class=num style="background:${x.col}">${j+1}</span><span class=rt><b>${ls.t}</b><small>${ls.q.length} سؤال في الامتحان</small></span><span class="${b>=60?'t':'sub'}">${b>=60?'✓ '+b+'%':(b?b+'%':'')}</span></div>`}).join('')).join('')}
function lesson(){const x=T(),ls=x.levels[view.i].lessons[view.j],k=view.i+'-'+view.j;
 const nxt=(()=>{const L=x.levels[view.i].lessons;if(view.j<L.length-1)return {i:view.i,j:view.j+1};if(view.i<x.levels.length-1)return {i:view.i+1,j:0};return null})();
 let h=`<button class=back onclick="go('track',{t:'${x.id}'})">→ ${x.name}</button><p class=sub>الدرس ${view.j+1}</p><h1>${ls.t}</h1>`;
 h+=`<div class=card def><b class=t>التعريف</b><p>${e(ls.def)}</p><b class=t>ليه مهم؟</b><p>${e(ls.why)}</p></div>`;
 ls.parts.forEach(p=>{h+=`<h2>${e(p.h)}</h2>`+p.p.map(s=>`<p>${e(s)}</p>`).join('')+(p.code?`<pre dir=ltr>${e(p.code)}</pre>`:'')});
 h+=`<h2 style="margin-top:36px">امتحان الدرس (${ls.q.length} سؤال)</h2>`;
 ls.q.forEach((q,n)=>{h+=`<div class=card><p><b>${n+1}. ${e(q[0])}</b></p>`+q[1].map((o,m)=>{let c='';if(checked){if(m===q[2])c='ok';else if(ans[n]===m)c='bad'}else if(ans[n]===m)c='sel';return `<button class="opt ${c}" onclick="pick(${n},${m})">${e(o)}</button>`}).join('')+`</div>`});
 if(!checked)h+=`<button class="p wide" onclick="finish()">تسليم الامتحان</button>`;
 else{const s=score(ls);h+=`<div class=card><h2 style=margin-top:0 class="${s>=60?'t':'err'}">${s>=60?'🎉 نجحت':'جرّب تاني'}: ${s}%</h2><p class=sub>${s>=60?'الدرس اتحسب خلصان.':'محتاج 60% علشان الدرس يتحسب. راجع الشرح وحاول تاني.'}</p><button onclick="go('lesson',{t:'${x.id}',i:${view.i},j:${view.j}})">أعد الامتحان</button> ${nxt&&s>=60?`<button class=p onclick="go('lesson',{t:'${x.id}',i:${nxt.i},j:${nxt.j}})">الدرس التالي ←</button>`:''}</div>`}
 return h}
function score(ls){let c=0;ls.q.forEach((q,n)=>{if(ans[n]===q[2])c++});return Math.round(c/ls.q.length*100)}
function pick(n,m){if(checked)return;ans[n]=m;const y=window.scrollY;render();window.scrollTo(0,y)}
function finish(){const x=T(),ls=x.levels[view.i].lessons[view.j];if(Object.keys(ans).length<ls.q.length){alert('جاوب على كل الأسئلة الأول');return}
 checked=true;const s=score(ls),k=key(x.id,view.i+'-'+view.j);if(s>(prog[k]||0)){prog[k]=s;saveProg()}render();document.querySelector('h2.t,h2.err')?.scrollIntoView({behavior:'smooth'})}
async function init(){
 if(sb){try{const {data}=await sb.auth.getSession();if(data&&data.session){user=data.session.user;const p=user.user_metadata&&user.user_metadata.progress;if(p)prog=Object.assign({},prog,p);localStorage.setItem('prog',JSON.stringify(prog))}
 sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_IN'&&s&&!user){user=s.user;render()}})}catch(x){}}
 render()}
init();

</script></body></html>
